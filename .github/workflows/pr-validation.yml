name: PR Validation

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & cache
        uses: gradle/actions/setup-gradle@v4

      - name: Decode google-services.json
        run: bash .github/scripts/init-google-services.sh
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        continue-on-error: true

      - name: Build (debug)
        run: ./gradlew assembleDebug
        shell: bash
        env:
          CI: true

      - name: Unit tests
        run: ./gradlew test
        shell: bash
        env:
          CI: true

      - name: Lint check
        run: ./gradlew lint
        shell: bash
        env:
          CI: true

      - name: Coverage report (JaCoCo)
        run: ./gradlew jacocoTestReport
        shell: bash
        env:
          CI: true

      - name: PR size check (advisory)
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ADDITIONS=$(gh pr view ${{ github.event.number }} --json additions --jq '.additions // 0')
          CHANGED_FILES=$(gh pr view ${{ github.event.number }} --json changedFiles --jq '.changedFiles // 0')
          DELETIONS=$(gh pr view ${{ github.event.number }} --json deletions --jq '.deletions // 0')
          echo "PR Stats: +$ADDITIONS / -$DELETIONS lines, $CHANGED_FILES files"
          if [ "$ADDITIONS" -gt 500 ] || [ "$CHANGED_FILES" -gt 20 ]; then
            echo "AVISO: PR excede o tamanho recomendado (500 linhas / 20 arquivos)"
          fi
        shell: bash

      - name: SonarQube Cloud analysis
        uses: SonarSource/sonarcloud-github-action@v5
        if: always()
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=lucas-de-lima_louve-mobile-app
            -Dsonar.organization=lucas-de-lima
            -Dsonar.java.binaries=app/build/tmp/kotlin-classes/debug
            -Dsonar.tests=app/src/test
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/test/jacocoTestReport.xml
            -Dsonar.exclusions=**/*.png,**/*.webp,**/*.jpg,**/*.jks,**/*.jar
            -Dsonar.gradle.skipCompile=true
        continue-on-error: true

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}

            ### Changelog
            Para detalhes completos, consulte [CHANGELOG_DETALHADO.md](CHANGELOG_DETALHADO.md).

            ### Informacoes
            - **Versao**: ${{ github.ref_name }}
            - **Data**: ${{ github.event.head_commit.timestamp }}
            - **Commit**: ${{ github.sha }}
          draft: false
          prerelease: ${{ contains(github.ref_name, 'beta') || contains(github.ref_name, 'alpha') }}
        env:
GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
