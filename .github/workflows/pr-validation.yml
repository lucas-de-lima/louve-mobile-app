name: PR Validation

on:
  pull_request:
    branches: [develop, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew
        shell: bash

      - name: google-services.json
        run: |
          python -c "
          import json, os
          GOOGLE_SERVICES_JSON = os.environ.get('GOOGLE_SERVICES_JSON', '')
          if GOOGLE_SERVICES_JSON:
            try:
              import base64
              decoded = base64.b64decode(GOOGLE_SERVICES_JSON).decode()
              json.loads(decoded)
              with open('app/google-services.json', 'w') as f:
                f.write(decoded)
              print('OK google-services.json decodificado com sucesso')
            except Exception:
              pass
          if not os.path.exists('app/google-services.json'):
            json.dump({
              'project_info': {'project_number': '0', 'project_id': 'ci-placeholder', 'storage_bucket': 'ci-placeholder'},
              'client': [{
                'client_info': {'mobilesdk_app_id': '1:0:android:ci-placeholder', 'android_client_info': {'package_name': 'com.lucasdelima.louveapp'}},
                'oauth_client': [], 'api_key': [{'current_key': 'ci-placeholder'}],
                'services': {'appinvite_service': {'other_platform_oauth_client': []}}
              }],
              'configuration_version': '1'
            }, open('app/google-services.json', 'w'), indent=2)
            print('OK google-services.json placeholder criado')
          "
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        continue-on-error: true

      - name: Build (debug)
        run: ./gradlew assembleDebug
        shell: bash
        env:
          CI: true

      - name: Unit tests
        run: ./gradlew test
        shell: bash
        env:
          CI: true

      - name: Lint
        run: ./gradlew lint
        shell: bash
        continue-on-error: true
        env:
          CI: true

      - name: Coverage report
        run: ./gradlew jacocoTestReport
        shell: bash
        continue-on-error: true
        env:
          CI: true

      - name: SonarCloud analysis
        uses: SonarSource/sonarcloud-github-action@v5
        continue-on-error: true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=lucas-de-lima_louve-mobile-app
            -Dsonar.organization=lucas-de-lima
            -Dsonar.java.binaries=app/build/tmp/kotlin-classes/debug
            -Dsonar.tests=app/src/test
            -Dsonar.sourceEncoding=UTF-8
            -Dsonar.coverage.jacoco.xmlReportPaths=app/build/reports/jacoco/test/jacocoTestReport.xml
            -Dsonar.exclusions=**/*.png,**/*.webp,**/*.jpg,**/*.jks,**/*.jar