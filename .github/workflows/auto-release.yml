name: Build and Attach APK
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: |
          python -c "
          import json, os
          GOOGLE_SERVICES_JSON = os.environ.get('GOOGLE_SERVICES_JSON', '')
          if GOOGLE_SERVICES_JSON:
            try:
              import base64
              decoded = base64.b64decode(GOOGLE_SERVICES_JSON).decode()
              json.loads(decoded)
              with open('app/google-services.json', 'w') as f:
                f.write(decoded)
              print('OK google-services.json decodificado com sucesso')
            except Exception:
              pass
          if not os.path.exists('app/google-services.json'):
            json.dump({
              'project_info': {'project_number': '0', 'project_id': 'ci-placeholder', 'storage_bucket': 'ci-placeholder'},
              'client': [{
                'client_info': {'mobilesdk_app_id': '1:0:android:ci-placeholder', 'android_client_info': {'package_name': 'com.lucasdelima.louveapp'}},
                'oauth_client': [], 'api_key': [{'current_key': 'ci-placeholder'}],
                'services': {'appinvite_service': {'other_platform_oauth_client': []}}
              }],
              'configuration_version': '1'
            }, open('app/google-services.json', 'w'), indent=2)
            print('OK google-services.json placeholder criado')
          "
        shell: bash
        continue-on-error: true
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - run: chmod +x gradlew
        shell: bash
      - run: ./gradlew assembleDebug
        shell: bash
        env:
          CI: true
      - run: |
          TAG=${{ github.event.release.tag_name }}
          VERSION=${TAG#v}
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/louve-app-v$VERSION.apk 2>/dev/null || true
        shell: bash
      - uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*.apk