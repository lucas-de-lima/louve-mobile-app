name: Build and Attach APK
on:
  release:
    types: [published]
  workflow_dispatch:
jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: bash .github/scripts/init-google-services.sh
        shell: bash
        continue-on-error: true
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
      - run: chmod +x gradlew
        shell: bash
      - run: ./gradlew assembleDebug
        shell: bash
        env:
          CI: true
      - run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/louve-app-v$VERSION.apk 2>/dev/null || true
        shell: bash
      - uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*.apk