name: Build and Attach APK

on:
  release:
    types: [published]
  workflow_dispatch:

env:
  # Package name extraído do google-services.json (registrado no Firebase)
  ANDROID_PACKAGE_NAME: com.lucasdelima.louveapp
  # Projeto Firebase
  FIREBASE_PROJECT_ID: louve-app-mobile

jobs:
  build-and-attach:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # ── google-services.json ──────────────────────────────────────
      # Decodifica o google-services.json real se fornecido como secret.
      # Se secret não existe, cria placeholder (funciona para build mas
      # Firebase Auth/ Firestore quebram no runtime).
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          set +x
          if [ -z "$GOOGLE_SERVICES_JSON" ]; then
            echo "GOOGLE_SERVICES_JSON não configurado. Criando placeholder (Firebase Auth não funcionará)"
            python3 << 'PYEOF'
import json
json.dump({
  'project_info': {'project_number': '0', 'project_id': 'ci-placeholder', 'storage_bucket': 'ci-placeholder'},
  'client': [{
    'client_info': {'mobilesdk_app_id': '1:0:android:ci-placeholder', 'android_client_info': {'package_name': 'com.lucasdelima.louveapp'}},
    'oauth_client': [], 'api_key': [{'current_key': 'ci-placeholder'}],
    'services': {'appinvite_service': {'other_platform_oauth_client': []}}
  }],
  'configuration_version': '1'
}, open('app/google-services.json', 'w'), indent=2)
print('OK google-services.json placeholder criado')
PYEOF
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | base64 -d > /tmp/gs.json || {
              echo "ERRO: GOOGLE_SERVICES_JSON decode falhou. Re-encode com: [Convert]::ToBase64String([IO.File]::ReadAllBytes('google-services.json'))"
              exit 1
            }
            python3 -c "import json; json.load(open('/tmp/gs.json')); print('OK JSON válido')" || {
              echo "ERRO: google-services.json decodificado não é JSON válido"
              exit 1
            }
            mv /tmp/gs.json app/google-services.json
            echo "OK google-services.json decodificado (voltei ao arquivo original sem placeholder)"
          fi
        shell: bash

      # ── Decodifica keystore ───────────────────────────────────────
      # O keystore JKS é armazenado como base64 no secret.
      # Processo inverso do comando: base64 -w0 louve-app-keystore.jks
      - name: Decode keystore
        env:
          LOUVE_KEYSTORE_BASE64: ${{ secrets.LOUVE_KEYSTORE_BASE64 }}
        run: |
          printf '%s' "$LOUVE_KEYSTORE_BASE64" | base64 -d > app/louve-app-keystore.jks || {
            echo "ERRO: base64 decode falhou. Verifique secret LOUVE_KEYSTORE_BASE64"
            exit 1
          }
          # Confirma que o arquivo não está vazio
          if [ -s app/louve-app-keystore.jks ]; then
            echo "OK keystore decodificado ($(stat -c%s app/louve-app-keystore.jks) bytes)"
          else
            echo "ERRO: keystore decodificado está vazio"
            exit 1
          fi
        shell: bash

      # ── Extrai SHA-1 e registra no Firebase ──────────────────────
      # Usa gcloud com service account para autenticar na Firebase
      # Management API. Este step é non-blocking: se falhar, o build
      # continua e o SHA deve ser registrado manualmente no Console.
      - name: Register SHA-1 in Firebase
        continue-on-error: true
        env:
          FIREBASE_SA_KEY: ${{ secrets.FIREBASE_SA_KEY }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
        run: |
          echo "Decodificando service account..."
          printf '%s' "$FIREBASE_SA_KEY" | base64 -d > /tmp/firebase-sa.json || {
            echo "WARN: FIREBASE_SA_KEY inválido ou ausente. Registre o SHA-1 manualmente em Firebase Console"
            exit 0
          }

          echo "Extraindo SHA-1 do keystore..."
          SHA1=$(keytool -list -v -keystore app/louve-app-keystore.jks \
            -alias louve-app-key \
            -storepass "$STORE_PASSWORD" 2>/dev/null \
            | grep "SHA1" | head -1 | cut -d: -f2- | tr -d ' ')
          echo "::add-mask::$SHA1"
          echo "SHA1=$SHA1"

          echo "Autenticando gcloud..."
          gcloud auth activate-service-account \
            --key-file=/tmp/firebase-sa.json \
            --project=${{ env.FIREBASE_PROJECT_ID }} 2>&1 || {
            echo "WARN: falha auth gcloud. Registre SHA-1 manualmente em Firebase Console"
            rm -f /tmp/firebase-sa.json
            exit 0
          }

          ACCESS_TOKEN=$(gcloud auth print-access-token)
          echo "Listando apps Android no Firebase..."
          APPS_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebase.googleapis.com/v1beta1/projects/${{ env.FIREBASE_PROJECT_ID }}/androidApps")
          HTTP_CODE=$(echo "$APPS_RESPONSE" | tail -1)
          APPS_JSON=$(echo "$APPS_RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "WARN: API retornou HTTP $HTTP_CODE. Resposta: $(echo "$APPS_JSON" | head -c 200)"
            echo "Registre SHA-1 manualmente em Firebase Console"
            rm -f /tmp/firebase-sa.json
            exit 0
          fi

          APP_ID=$(echo "$APPS_JSON" | python3 -c "
import sys, json
apps = json.load(sys.stdin).get('androidApps', [])
for app in apps:
    if app.get('packageName') == '${{ env.ANDROID_PACKAGE_NAME }}':
        print(app['name'].split('/')[-1])
        sys.exit(0)
print('NOT_FOUND')
          ")

          if [ "$APP_ID" = "NOT_FOUND" ]; then
            echo "WARN: app ${{ env.ANDROID_PACKAGE_NAME }} não encontrado no Firebase."
            echo "Verifique google-services.json ou registre SHA-1 manualmente em Firebase Console > Project Settings"
            rm -f /tmp/firebase-sa.json
            exit 0
          fi

          echo "Verificando se SHA já está registrado..."
          EXISTING_RESPONSE=$(curl -s -w "\n%{http_code}" \
            -H "Authorization: Bearer $ACCESS_TOKEN" \
            "https://firebase.googleapis.com/v1beta1/projects/${{ env.FIREBASE_PROJECT_ID }}/androidApps/$APP_ID/sha")
          EXISTING_HTTP_CODE=$(echo "$EXISTING_RESPONSE" | tail -1)
          EXISTING_SHAS=$(echo "$EXISTING_RESPONSE" | sed '$d')

          SHA_ALREADY_EXISTS=$(echo "$EXISTING_SHAS" | python3 -c "
import sys, json
certs = json.load(sys.stdin).get('certificates', [])
for cert in certs:
    if cert.get('sha1') == '$SHA1':
        print('yes')
        sys.exit(0)
print('no')
          ")

          if [ "$SHA_ALREADY_EXISTS" = "no" ]; then
            echo "Registrando SHA-1..."
            curl -s -X POST \
              -H "Authorization: Bearer $ACCESS_TOKEN" \
              -H "Content-Type: application/json" \
              -d "{\"sha1\": \"$SHA1\"}" \
              "https://firebase.googleapis.com/v1beta1/projects/${{ env.FIREBASE_PROJECT_ID }}/androidApps/$APP_ID/sha"
            echo "OK SHA-1 registrado no Firebase"
          else
            echo "OK SHA-1 já registrado, pulando"
          fi

          rm -f /tmp/firebase-sa.json
        shell: bash

      - run: chmod +x gradlew
        shell: bash

      # ── Build APK de release assinado ────────────────────────────
      # Usa CI=true para ativar assinatura via env vars.
      # O signing config no build.gradle.kts lê KEY_ALIAS, KEY_PASSWORD,
      # STORE_PASSWORD do ambiente quando CI=true.
      - name: Build release APK
        run: ./gradlew assembleRelease
        shell: bash
        env:
          CI: true
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}

      # ── Prepara artefato ─────────────────────────────────────────
      - name: Prepare artifact
        run: |
          TAG=${{ github.event.release.tag_name }}
          VERSION=${TAG#v}
          mkdir -p release-artifacts
          cp app/build/outputs/apk/release/app-release.apk \
            release-artifacts/louve-app-v$VERSION.apk 2>/dev/null || true
        shell: bash

      - uses: softprops/action-gh-release@v3
        with:
          files: release-artifacts/*.apk

  # ────────────────────────────────────────────────────────────────────
  # TODO: Quando o app for publicado no Google Play:
  #
  # 1. Ative Play App Signing no Play Console
  # 2. No Firebase Console, registre o SHA-1 da App Signing Key
  #    (encontrada em Play Console > Setup > App Integrity)
  # 3. NÃO registre o SHA-1 da Upload Key — só a App Signing Key importa
  # 4. Mude este workflow para:
  #    a) build com `./gradlew bundleRelease` (AAB, não APK)
  #    b) Publique via `google-play-gradle-plugin` ou Play Console
  #    c) Remova o step "Register SHA-1 in Firebase" — é permanente
  #    d) Mantenha o decode do keystore (usado como upload key)
  #
  # Workflow simplificado pós-Play:
  #   steps:
  #     - decode keystore (upload key)
  #     - decode google-services.json
  #     - ./gradlew bundleRelease
  #     - upload AAB ao Play Console
  #     - (SHA-1 já registrado: o da App Signing Key, não muda)
  # ────────────────────────────────────────────────────────────────────