name: Auto Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'

jobs:
  release:
    name: Build, Tag & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle & cache
        uses: gradle/actions/setup-gradle@v4

      - name: Initialize google-services.json
        run: bash .github/scripts/init-google-services.sh
        shell: bash
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        continue-on-error: true

      - name: Build APK (debug)
        run: ./gradlew assembleDebug
        shell: bash
        env:
          CI: true

      - name: Read version from build.gradle.kts
        id: version
        run: |
          VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Extracted version: $VERSION"
        shell: bash

      - name: Check if tag already exists
        id: tag_check
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          if git rev-parse "$TAG" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG already exists — skipping tag creation"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG will be created"
          fi
        shell: bash

      - name: Create and push tag
        if: steps.tag_check.outputs.exists == 'false'
        run: |
          TAG="v${{ steps.version.outputs.version }}"
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"
        shell: bash

      - name: Package APK
        run: |
          mkdir -p release-artifacts
          cp app/build/outputs/apk/debug/app-debug.apk release-artifacts/louve-app-v${{ steps.version.outputs.version }}.apk 2>/dev/null || true
        shell: bash

      - name: Create Release
        uses: softprops/action-gh-release@v3
        if: steps.tag_check.outputs.exists == 'false'
        with:
          tag_name: v${{ steps.version.outputs.version }}
          name: Release v${{ steps.version.outputs.version }}
          files: release-artifacts/*.apk
          body: |
            ## Louve App v${{ steps.version.outputs.version }}

            **Build:** ${{ github.sha }}

            ### Instalacao
            Baixe o APK abaixo e instale no seu dispositivo Android.
            Permita instalacao de fontes desconhecidas se necessario.

            ### Changelog
            Consulte [CHANGELOG_DETALHADO.md](CHANGELOG_DETALHADO.md) para detalhes completos.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}